<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Garlic Press prototype</title>
<style>
:root{color-scheme:dark;--bg:#08090a;--panel:#0f1011;--card:#141516;--card-h:#191a1c;--line:#1f2023;--line-2:#2a2b2f;--fg:#ededef;--fg-2:#a1a1aa;--fg-3:#85858e;--accent:#7c7cff;--on-accent:#0b0b1e;--red:#f26d6d;--amber:#e5a54b;--green:#4cc38a;--head:rgba(8,9,10,.9);--over:#111225;--veil:rgba(0,0,0,.5);--sans:"Geist",ui-sans-serif,system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,monospace}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){color-scheme:light;--bg:#f7f7f8;--panel:#efeff2;--card:#fff;--card-h:#f7f7f9;--line:#e6e6ea;--line-2:#d0d0d8;--fg:#18181b;--fg-2:#52525b;--fg-3:#6b6b74;--accent:#5b5bd6;--on-accent:#fff;--red:#c62f2f;--amber:#8f5c0f;--green:#1a7549;--head:rgba(247,247,248,.92);--over:#eeeefc;--veil:rgba(20,20,30,.25)}}
:root[data-theme=light]{color-scheme:light;--bg:#f7f7f8;--panel:#efeff2;--card:#fff;--card-h:#f7f7f9;--line:#e6e6ea;--line-2:#d0d0d8;--fg:#18181b;--fg-2:#52525b;--fg-3:#6b6b74;--accent:#5b5bd6;--on-accent:#fff;--red:#c62f2f;--amber:#8f5c0f;--green:#1a7549;--head:rgba(247,247,248,.92);--over:#eeeefc;--veil:rgba(20,20,30,.25)}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body{overflow-x:clip}button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--head);backdrop-filter:blur(12px)}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;white-space:nowrap}.logo i{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,var(--accent),#b3b3ff)}
.mock{font:500 12px var(--mono);color:var(--amber);border:1px solid currentColor;border-radius:5px;padding:1px 7px;white-space:nowrap}
.sp{flex:1}.search{background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;width:220px;font-size:14px}
.btn{background:var(--fg);color:var(--bg);border:1px solid transparent;border-radius:8px;padding:7px 12px;font-weight:500;font-size:14px;cursor:pointer}.btn:hover{opacity:.9}
.btn.gh{background:transparent;color:var(--fg-2);border-color:var(--line-2)}.btn.ac{background:var(--accent);color:var(--on-accent)}.btn:disabled{background:var(--line-2);color:var(--fg-3);cursor:not-allowed;opacity:1}.btn[aria-pressed=true]{border-color:var(--accent);color:var(--fg);background:var(--over)}
.app{display:grid;grid-template-columns:190px minmax(0,1fr) 320px;align-items:start}.app.nochat{grid-template-columns:190px minmax(0,1fr)}
nav{position:sticky;top:55px;display:flex;flex-direction:column;gap:2px;padding:16px 10px}
nav button{display:flex;gap:8px;align-items:center;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;color:var(--fg-2);cursor:pointer;white-space:nowrap}nav button:hover{background:var(--card);color:var(--fg)}nav button[aria-current]{background:var(--card-h);color:var(--fg);box-shadow:0 0 0 1px var(--line-2)}nav .n{margin-left:auto;font:12px var(--mono);color:var(--fg-3)}
main{padding:20px 20px 60px;border-left:1px solid var(--line);min-height:calc(100vh - 56px)}
h1{font-size:24px;letter-spacing:-.02em;margin:0;display:flex;align-items:center;gap:8px;outline:none}.hd{margin-bottom:16px}.hd p{margin:4px 0 0;color:var(--fg-2);max-width:68ch}
h2{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;margin:24px 0 8px}h2 .n{color:var(--fg-3);font:13px var(--mono)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}button.card{display:block;width:100%;text-align:left;cursor:pointer}button.card:hover{background:var(--card-h);border-color:var(--line-2)}
.t{font-weight:500}.sub{color:var(--fg-2);font-size:14px}.ex-t{margin:4px 0 0;color:var(--fg-2)}
.list{display:flex;flex-direction:column;gap:8px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.meta,.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}.bar{gap:8px}
.tag{font:12px var(--mono);color:var(--fg-2);border:1px solid var(--line-2);border-radius:5px;padding:1px 6px}.tag.g{color:var(--green);border-color:currentColor}.tag.a{color:var(--amber);border-color:currentColor}.tag.r{color:var(--red);border-color:currentColor}.tag.v{color:var(--accent);border-color:currentColor}
.chip{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--fg-2);cursor:pointer}.chip[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
textarea,.in{width:100%;background:var(--card);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;line-height:1.55;font-size:16px}textarea{min-height:96px;resize:vertical}#md{min-height:320px;font:14px/1.6 var(--mono)}
label.f{display:block;font-size:13px;color:var(--fg-2);margin-bottom:8px}label.ck{display:flex;gap:8px;align-items:flex-start;padding:6px 0}
.q{flex:none;width:20px;height:20px;border-radius:50%;border:1px solid var(--line-2);background:none;color:var(--fg-3);font:600 12px/1 var(--mono);cursor:pointer;padding:0;position:relative;vertical-align:middle}.q::after{content:"";position:absolute;inset:-10px}.q:hover,.q:focus-visible{color:var(--accent);border-color:var(--accent)}
.ex{display:none}.guide .ex{display:block;flex-basis:100%;margin:6px 0 10px;padding:8px 12px;border:1px dashed var(--accent);border-radius:8px;background:var(--over);font-size:14px;font-weight:400;color:var(--fg);letter-spacing:0}
.guide h1,.guide h2{flex-wrap:wrap}.prop{display:inline-block;color:var(--amber);font:500 12px var(--mono);margin-right:6px}
#tip{position:fixed;z-index:40;max-width:min(320px,calc(100vw - 24px));background:var(--card);border:1px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.35);pointer-events:none}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}.col{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:160px;display:flex;flex-direction:column;gap:8px}.col h3{margin:0;font:500 13px var(--mono);color:var(--fg-2)}
.chat{position:sticky;top:55px;height:calc(100vh - 56px);border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}.chat .ch{padding:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);font-weight:600}.log{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}.m{border:1px solid var(--line-2);border-radius:10px;padding:8px 12px;background:var(--bg);white-space:pre-wrap;overflow-wrap:anywhere}.m.me{background:var(--over);align-self:flex-end}.chat form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.veil{position:fixed;inset:0;background:var(--veil);z-index:9}aside{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--panel);border-left:1px solid var(--line-2);z-index:10;overflow:auto;padding:20px 24px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:30;max-width:90vw}
.item{display:flex;gap:8px;align-items:flex-start}.item>div{flex:1}.mv{background:none;border:1px solid var(--line-2);border-radius:6px;padding:4px 9px;cursor:pointer;color:var(--fg-2)}
.q-src{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}mark{background:var(--over);color:inherit;border-bottom:2px solid var(--accent)}
#chatfab{display:none}
@media(max-width:1180px){.app,.app.nochat{grid-template-columns:170px minmax(0,1fr)}.chat{display:none;position:fixed;inset:auto 0 0 auto;top:0;height:100dvh;width:min(380px,100%);z-index:8}.chat.open{display:flex}#chatfab{display:block}}
@media(max-width:760px){header{position:static;flex-wrap:wrap;padding:8px 14px;gap:8px}header .sp{display:none}header .btn{padding:7px 9px;font-size:13px}.search{order:9;width:100%;font-size:16px}.app,.app.nochat{display:block}nav{position:static;flex-direction:row;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--line)}nav button{flex:none;min-height:42px}main{border:0;padding:16px 16px 60px}.two{grid-template-columns:minmax(0,1fr)}.board{grid-auto-columns:78%}.btn{min-height:40px}.chip{min-height:36px}}
@media(prefers-reduced-motion:no-preference){.toast{animation:up .2s}@keyframes up{from{opacity:0}}}
</style></head><body>
<header><div class="logo"><i></i>Garlic Press</div><span class="mock">Mock data</span><span id="mocktip"></span><span class="sp"></span>
<input class="search" id="search" type="search" placeholder="Search everything" aria-label="Search everything" data-tip="search">
<button class="btn gh" id="guide" aria-pressed="false" data-tip="guide">Show all explanations</button>
<button class="btn gh" id="chatfab" data-tip="chat">Chat</button>
<button class="btn gh" id="theme" aria-label="Switch light or dark" data-tip="theme">Theme</button>
<button class="btn gh" id="reset" data-tip="reset">Reset</button></header>
<div class="app"><nav id="nav" aria-label="Sections"></nav><main id="main"></main>
<section class="chat" id="chat" aria-label="Chat"><div class="ch">Chat <span class="mock">Mock replies</span><span id="chattip"></span><span class="sp"></span><button class="mv" id="chatx" aria-label="Close chat">Close</button></div><div class="log" id="log" aria-live="polite"></div><form id="cf"><input class="in" id="ci" aria-label="Message" placeholder="Ask about a block or draft"><button class="btn ac">Send</button></form></section></div>
<div id="side"></div><div id="tip" role="tooltip" hidden></div><div id="toast" aria-live="polite"></div>
<script>{
const P='<b class="prop">Proposal, not settled</b>';
const TIPS={
mock:'Everything here is invented for this demo. Nothing is read from or written to Airtable, Obsidian, GHL or any other tool.',
search:'Finds sources, ideas, blocks and drafts as you type. It only looks inside this app.',guide:'Guided mode: shows every explanation on the page instead of behind the question marks.',theme:'Switches between light and dark. Same colours as Unit12.',reset:'Puts the mock data back as it was when you opened the page.',chat:'Ask for a block, what needs you, or where a block is used. In the real app the chat reads the same database as the screens. Here the replies are canned.',
home:'Your starting point. Drop something in, see what comes next, and answer only what needs you.',capture:'Say it, type it, paste a link or add a file. Your words are saved exactly as given, as a small source, and then cut into proposed blocks. Nothing is rewritten. '+P+'The original is stored as a Markdown file in Obsidian, with a record in SQLite.',dict:'Dictate: here it fills in sample words. Link: saved as an external item, marked fact or inspiration. File: only its name is kept in this demo, the file is not read.',next:'Drafts in progress, in the order they move. Open one to continue. It reads the same records as the Board.',needs:'Only decisions that nobody else can take: blocks to validate, versions to review, drafts whose block changed.',
sources:'The library everything comes from. Sources are fixed files: book, workshops, podcasts, transcripts. They are never edited here, so every block can be traced to its exact words.',external:'External items are web articles or videos by other people. They are marked as fact or inspiration and never shown or used as your words. A fact can be cited in a draft, an inspiration cannot be placed in one.',srcopen:'Opens the original text with the excerpts already cut from it highlighted.',cut:'Proposes exact excerpts from this source. They go to Block review. '+P+'Nothing enters the bank before Ian validates it.',
ideas:'An idea is a small source. Your words stay as you gave them, then get cut into blocks, and the idea stays linked to everything made from it.',filters:'Filters only change what you see. Never used: no block of the idea is in a draft. Ready: idea and blocks validated. To review: blocks wait for you.',
bank:'All reusable pieces, each an exact excerpt with its source. Workshops, ads, emails and posts all pull from here. '+P+'Blocks enter the bank only after Ian validates them.',role:'What the block does in a piece: hook, story, teaching, objection, proof, exercise or offer.',rights:'Whether the excerpt can be reused: already public, not public yet, client permission needed, or someone else\'s content.',used:'Every draft, workshop segment and ad that contains this block. It updates as soon as you save a piece.',exact:'The app compares the block with the source letter by letter. Edited means the words were changed by hand: the original excerpt stays next to it.',edit:'Edit the words and save. The original excerpt and its source stay visible, the block is marked Edited, and Restore brings the original back. The source file itself never changes.',change:'Changing an excerpt sends the block back to review and flags the drafts that use it. Approved drafts are never changed silently.',
review:'Where proposed blocks become usable. Three lanes, depending on the risk.',batch:'Exact excerpts that are already public carry little risk, so you can tick several and validate together. '+P+'Batch validation is a suggestion.',ideab:'An idea and its blocks are validated together, so you read the context once. Untick a block to leave it out.',one:'Client proof and external content are read one at a time. Client proof also needs the client\'s permission. Nothing here can be done in bulk.',
drafts:'One draft is one piece for one channel: an ordered list of blocks, plus transitions and a CTA. '+P+'The text lives in Markdown in Obsidian. SQLite keeps the blocks used, status, approved versions and live link.',order:'The blocks in order. Move or remove them, then save. Transitions and the CTA are flagged because they are not exact excerpts.',md:'The full text, editable beside the chat. Saving makes a new version and reopens the review, so an approval always refers to one exact text.',vers:'Every saved text is kept. The version you approved is marked, and later edits never replace it.',decide:'Use approves this exact version for the platforms ticked. Hold keeps it waiting. Skip drops it, without deleting it. Approving publishes nothing.',publish:'After someone has posted the piece, paste the live link. Without that proof the draft cannot move to Published. Nothing is sent from here.',ctx:'Offer, CTA and destination. They belong to this draft only and don\'t change the blocks.',
board:'The whole pipeline. A card moves when its draft is saved, reviewed or published. '+P+'The lane names are still an open question.',workshop:'Builds one workshop segment from validated blocks. Pick, order, save: it becomes a draft to review. Same bank as the ads.',ad:'Builds one ad from validated blocks. Pick a hook, a body and a CTA. Same bank as the workshops, so a good block works in both.',pick:'Only validated blocks appear. External facts are marked. Inspirations never appear here.',build:'What you are assembling, in order. Add a transition where two blocks need joining: it stays flagged as not an exact excerpt. Saving creates a draft and updates "Used in" on each block.',
store:P+'One SQLite database would replace Airtable after a read-only import: totals compared, an archive made first, and only with Ian\'s yes. Nothing is deleted before that.',results:'Click a result to open it.'};
const t=k=>`<button type="button" class="q" data-tip="${k}" aria-label="Explain this">?</button><span class="ex">${TIPS[k]}</span>`;
const e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const W='Sample words for this demo. ';
function seed(){const S={n:20,dn:5,view:'home',filter:'All',bf:'All',draft:'D1',q:'',build:null,log:[{w:'ai',x:'Ask me "what needs me", "where is B2 used" or "find oven".'}]};
S.sources=[
{id:'S1',type:'Book',title:'Sample book: The Lantern Bakery Method',text:W+'A menu with forty cakes tells nobody what to come for. Pick the one cake people already drive across town to buy. Write down three customers who came back, and what they bought. A small menu feels like a risk until the first quiet Tuesday.'},
{id:'S2',type:'Workshop',title:'Sample workshop: One Cake, One Town',text:W+'Draw your street and mark where each regular lives. The cake is not the product, the birthday is. Most bakers ask how to get more visitors, when the question is who comes back. Bring your last ten orders to the next session.'},
{id:'S3',type:'Podcast',title:'Sample podcast: Episode 12, slow ovens',text:W+'The oven broke on a Saturday and we sold only one cake all day. That day was the best day of the year. People say a narrow menu scares customers away.'},
{id:'S4',type:'Transcript',title:'Sample transcript: client call (fictional)',text:W+'A fictional baker says the waiting list went from none to six weeks.'},
{id:'S5',type:'Web article',ext:'fact',title:'Sample article: bakery opening hours survey',text:'Sample external text. Seven in ten surveyed bakeries in this invented survey close before five.'},
{id:'S6',type:'Web video',ext:'inspiration',title:'Sample video: window displays',text:'Sample external text. An invented creator shows a window with a single cake.'}];
S.ideas=[{id:'I1',text:'What if the window only ever showed one cake? People would stop and ask why.',offer:'Workshop',st:'to review',at:'Yesterday'},{id:'I2',text:'A regular is worth more than a hundred passers-by. Count regulars, not visitors.',offer:'Ad',st:'ready',at:'Monday'}];
const b=(id,role,src,text,reuse,st)=>({id,role,src,text,reuse,st,perm:false});
S.blocks=[b('B1','Hook','S1','A menu with forty cakes tells nobody what to come for.','public','validated'),b('B2','Teaching','S1','Pick the one cake people already drive across town to buy.','public','validated'),b('B3','Exercise','S1','Write down three customers who came back, and what they bought.','public','proposed'),b('B4','Exercise','S2','Draw your street and mark where each regular lives.','public','validated'),b('B5','Teaching','S2','The cake is not the product, the birthday is.','public','proposed'),b('B6','Story','S3','The oven broke on a Saturday and we sold only one cake all day.','candidate','validated'),b('B7','Objection','S3','People say a narrow menu scares customers away.','public','proposed'),b('B8','Proof','S4','A fictional baker says the waiting list went from none to six weeks.','proof','proposed'),b('B9','Fact','S5','Seven in ten surveyed bakeries in this invented survey close before five.','external','proposed'),b('B10','Hook','I1','What if the window only ever showed one cake?','idea','proposed'),b('B11','Teaching','I1','People would stop and ask why.','idea','proposed'),b('B12','Teaching','I2','Count regulars, not visitors.','idea','validated')];
const d=(id,title,ch,items,stage,x)=>Object.assign({id,title,ch,items,stage,offer:'Sample offer',dest:'Sample list',plats:[],vers:[],flag:false},x);
S.drafts=[d('D1','Sample email: one cake','Email',[{b:'B1'},{tr:'Here is what to do about it.'},{b:'B2'},{cta:'Join the sample workshop.'}],'Ian edit'),d('D2','Sample post: the broken oven','LinkedIn post',[{b:'B6'},{cta:'Tell us your slowest day.'}],'Rough draft'),d('D3','Sample post: count regulars','LinkedIn post',[{b:'B12'}],'Published',{live:'https://example.com/mock-live-post'}),d('D4','Sample email: draw your street','Email',[{b:'B4'},{cta:'Reply with your map.'}],'Approved',{plats:['Email']})];
S.drafts.forEach(x=>{x.vers=[{n:1,text:compose(x,S),ok:x.stage==='Approved'||x.stage==='Published'}]});return S}
let S;const blk=id=>S.blocks.find(x=>x.id===id),src=id=>S.sources.find(x=>x.id===id)||S.ideas.find(x=>x.id===id),dr=id=>S.drafts.find(x=>x.id===id);
function compose(x,s=S){return '# '+x.title+'\n\n'+x.items.map(i=>i.b?s.blocks.find(k=>k.id===i.b).text:i.tr?i.tr:'**'+i.cta+'**').join('\n\n')+'\n'}
const sname=id=>{const s=src(id);return s.title||'Idea '+s.id},orig=b=>b.orig||b.text,exact=b=>src(b.src).text.includes(b.text),used=id=>S.drafts.filter(x=>x.items.some(i=>i.b===id));
const RI={public:['Already public','g'],candidate:['Not public yet',''],proof:['Client permission needed','a'],external:['External, not his words','r'],idea:['From an idea','v']};
const btag=b=>`<span class="tag ${RI[b.reuse][1]}">${RI[b.reuse][0]}</span>`;
const xtag=b=>b.orig?'<span class="tag a">Edited</span>':`<span class="tag ${exact(b)?'g':'r'}">${exact(b)?'Exact match':'Differs from source'}</span>`;
const origBox=b=>b.orig?`<div class="q-src" style="margin-top:8px" data-orig="${b.id}"><span class="sub">Original excerpt, from ${e(sname(b.src))}</span>\n${e(b.orig)}</div><div class="bar"><button class="btn gh" data-a="restore" data-id="${b.id}" data-tip="edit">Restore original</button></div>`:'';
const edBox=b=>S.ed===b.id?`<div class="card" style="margin:6px 0"><label class="f">Edit ${b.id}<textarea id="rt">${e(b.text)}</textarea></label><div class="sub">Original: ${e(orig(b))}<br>Source: ${e(sname(b.src))}</div><div class="bar"><button class="btn ac" data-a="rsave" data-id="${b.id}" data-tip="edit">Save edit</button><button class="btn gh" data-a="rcancel" data-id="${b.id}" data-tip="edit">Cancel</button></div></div>`:`<div class="bar"><button class="btn gh" data-a="redit" data-id="${b.id}" data-tip="edit">Edit ${b.id}</button></div>`;
const LANES=['Rough draft','Ian edit','On hold','Approved','Published'];
function bcard(b){const u=used(b.id);return `<button class="card" data-a="block" data-id="${b.id}" data-tip="exact"><span class="t">${b.id} ${b.role}</span><p class="ex-t">${e(b.text)}</p><span class="meta"><span class="tag ${b.st==='validated'?'g':'a'}">${b.st}</span>${btag(b)}${b.orig?'<span class="tag a">Edited</span>':''}<span class="tag">Used in ${u.length}</span></span></button>`}
function dcard(x){return `<button class="card" data-a="draft" data-id="${x.id}" data-tip="drafts"><span class="t">${e(x.title)}</span><span class="meta"><span class="tag">${e(x.ch)}</span><span class="tag ${x.stage==='Approved'||x.stage==='Published'?'g':''}">${x.stage}</span>${x.flag?'<span class="tag r">Block changed</span>':''}${x.live?'<span class="tag g">Live link (mock)</span>':''}</span></button>`}
const hd=(h,k,p)=>`<div class="hd"><h1 tabindex="-1">${h} ${t(k)}</h1><p>${p}</p></div>`;
